, "3 PM": 0, "4 PM": 34, "5 PM": 64, "6 PM": 93, "7 PM": 93, "8 PM": 73, "9 PM": 24, "10 PM": 0, "11 PM": 0}, "sunday": {"6 AM": 0, "7 AM": 0, "8 AM": 0, "9 AM": 0, "10 AM": 0, "11 AM": 0, "12 PM": 0, "1 PM": 0, "2 PM": 0, "3 PM": 0, "4 PM": 0, "5 PM": 0, "6 PM": 0, "7 PM": 0, "8 PM": 0, "9 PM": 0, "10 PM": 0, "11 PM": 0}}}];
const corridors = [{"name": "SARJAPURA ROAD CORRIDOR", "coords": [[12.9185, 77.6235], [12.9218, 77.6256], [12.925016, 77.627877], [12.9285, 77.6325], [12.932, 77.6375], [12.9355, 77.6435]]}, {"name": "80 FEET ROAD (1ST-4TH BLOCK)", "coords": [[12.924, 77.634], [12.92724, 77.63215], [12.9312, 77.6315], [12.936, 77.631], [12.941, 77.6305]]}, {"name": "KORAMANGALA 3RD & 6TH BLOCK CONNECTOR", "coords": [[12.92981, 77.6258], [12.9335, 77.624], [12.9362, 77.6221], [12.9381, 77.6185]]}, {"name": "100 FEET INNER RING CORRIDOR", "coords": [[12.922, 77.619], [12.9265, 77.623], [12.931, 77.627], [12.935, 77.631], [12.939, 77.635]]}];
const center = [12.925016, 77.627877];

const hours = [
  "6 AM", "7 AM", "8 AM", "9 AM", "10 AM", "11 AM", 
  "12 PM", "1 PM", "2 PM", "3 PM", "4 PM", "5 PM", 
  "6 PM", "7 PM", "8 PM", "9 PM", "10 PM", "11 PM"
];

// Initialize Map
const map = L.map('map', {
  zoomControl: false,
  preferCanvas: true
}).setView(center, 15);

// Dark Carto Theme (Exact match to reference image: pure dark roads + subtle grid)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap, © CARTO',
  maxZoom: 19
}).addTo(map);

// Add Navigation Arrow at Center Location (Matches your image's purple/blue arrow)
const arrowIcon = L.divIcon({
  className: 'custom-arrow',
  html: '<div class="user-nav-arrow"></div>',
  iconSize: [28, 36],
  iconAnchor: [14, 25]
});
L.marker(center, { icon: arrowIcon }).addTo(map);

// Add Corridor Road Labels (Exposition Park style in your image)
corridors.forEach(c => {
  const midPoint = c.coords[Math.floor(c.coords.length / 2)];
  L.tooltip({
    permanent: true,
    direction: 'center',
    className: 'corridor-label'
  })
  .setContent(c.name)
  .setLatLng(midPoint)
  .addTo(map);
});

// Layer Groups for Multi-layer Thermal Ribbon
const ribbonLayerOuter = L.layerGroup().addTo(map);
const ribbonLayerMid = L.layerGroup().addTo(map);
const ribbonLayerCore = L.layerGroup().addTo(map);
const poiPointsLayer = L.layerGroup().addTo(map);

let currentDay = 'monday';
let currentHourIdx = 5; // 11 AM
let isPlaying = false;
let playInterval = null;

// Thermal Color Mapping matching the uploaded image:
// Outer Halo: Dark Blue (#0044ff) -> Cyan (#00d4ff)
// Mid Band: Bright Yellow (#ffd000) -> Gold (#ff9900)
// Center Core: Deep Orange / Red (#ff3300)
function getCorridorColors(score) {
  if (score >= 75) {
    return {
      core: '#ff2a00',  // Deep glowing red
      mid: '#ffaa00',   // Vivid gold/amber
      outer: '#0088ff', // Electric cyan-blue
      coreWeight: 22,
      midWeight: 48,
      outerWeight: 85
    };
  } else if (score >= 45) {
    return {
      core: '#ff9900',  // Amber
      mid: '#e6e600',   // Lime/yellow
      outer: '#0055ff', // Blue
      coreWeight: 14,
      midWeight: 34,
      outerWeight: 65
    };
  } else {
    return {
      core: '#00dd88',  // Emerald
      mid: '#0099ff',   // Cyan
      outer: '#0022aa', // Indigo
      coreWeight: 8,
      midWeight: 22,
      outerWeight: 45
    };
  }
}

function renderThermalHeatmap() {
  const currentHour = hours[currentHourIdx];
  document.getElementById('timeVal').innerText = currentHour;

  ribbonLayerOuter.clearLayers();
  ribbonLayerMid.clearLayers();
  ribbonLayerCore.clearLayers();
  poiPointsLayer.clearLayers();

  // Compute average catchment footfall right now
  let sum = 0;
  pois.forEach(p => {
    sum += (p.schedule[currentDay] && p.schedule[currentDay][currentHour]) || 0;
  });
  const avgFootfall = pois.length ? Math.round(sum / pois.length) : 0;

  // Update HUD Risk (1 to 10 scale as in uploaded image)
  const riskIndex = Math.max(1, Math.min(10, Math.round(avgFootfall / 10)));
  document.getElementById('riskScore').innerText = riskIndex;
  document.getElementById('riskBar').style.width = (riskIndex * 10) + '%';
  document.getElementById('riskBar').style.background = riskIndex >= 8 ? '#ff3b30' : (riskIndex >= 5 ? '#ff9500' : '#34c759');

  const badgeEl = document.getElementById('statusBadge');
  if (riskIndex >= 8) {
    badgeEl.innerText = "PEAK CONGESTION";
    badgeEl.style.color = "#ff3b30";
    badgeEl.style.background = "rgba(255, 59, 48, 0.15)";
  } else if (riskIndex >= 5) {
    badgeEl.innerText = "STEADY FLOW";
    badgeEl.style.color = "#ff9500";
    badgeEl.style.background = "rgba(255, 149, 0, 0.15)";
  } else {
    badgeEl.innerText = "LIGHT TRAFFIC";
    badgeEl.style.color = "#34c759";
    badgeEl.style.background = "rgba(52, 199, 89, 0.15)";
  }

  const cColors = getCorridorColors(avgFootfall);

  // 1. Draw Multi-Layer Thermal Street Ribbons (The exact glowing highway visual from your image)
  corridors.forEach(c => {
    // Outer Blue/Cyan Halo (Wide, translucent)
    const outerLine = L.polyline(c.coords, {
      color: cColors.outer,
      weight: cColors.outerWeight,
      opacity: 0.35,
      lineCap: 'round',
      lineJoin: 'round'
    });
    ribbonLayerOuter.addLayer(outerLine);

    // Mid Yellow/Gold Ribbon
    const midLine = L.polyline(c.coords, {
      color: cColors.mid,
      weight: cColors.midWeight,
      opacity: 0.75,
      lineCap: 'round',
      lineJoin: 'round'
    });
    ribbonLayerMid.addLayer(midLine);

    // Core Red/Orange Spine
    const coreLine = L.polyline(c.coords, {
      color: cColors.core,
      weight: cColors.coreWeight,
      opacity: 0.95,
      lineCap: 'round',
      lineJoin: 'round'
    });
    ribbonLayerCore.addLayer(coreLine);
  });

  // 2. Draw Medical POI Thermal Nodes
  pois.forEach(p => {
    const score = (p.schedule[currentDay] && p.schedule[currentDay][currentHour]) || 0;
    if (score > 0) {
      const haloRadius = 80 + (score * 1.8);
      const halo = L.circle([p.lat, p.lon], {
        radius: haloRadius,
        fillColor: score >= 70 ? '#ff3b30' : (score >= 40 ? '#ffcc00' : '#0099ff'),
        color: '#0099ff',
        weight: 0,
        fillOpacity: 0.22
      });
      poiPointsLayer.addLayer(halo);

      const pin = L.circleMarker([p.lat, p.lon], {
        radius: p.is_real_google ? 5.5 : 4,
        fillColor: score >= 70 ? '#ff3b30' : (score >= 40 ? '#ffcc00' : '#00ffff'),
        color: '#ffffff',
        weight: 1.5,
        fillOpacity: 1
      });

      pin.bindPopup(`
        <div style="font-family: sans-serif; font-size: 13px; color: #0f172a; min-width: 200px;">
          <b style="font-size: 14px;">${p.name}</b><br>
          <span style="color: #64748b;">${p.type}</span> ${p.is_real_google ? '<b style="color:#059669;">[REAL GOOGLE]</b>' : ''}<br>
          <hr style="margin: 6px 0; border: none; border-top: 1px solid #e2e8f0;">
          <b>${currentHour} Busyness:</b> <span style="font-size: 16px; font-weight: bold; color: ${score >= 70 ? '#ef4444' : '#0284c7'};">${score}%</span>
        </div>
      `);
      poiPointsLayer.addLayer(pin);
    }
  });
}

// UI Handlers
document.getElementById('hourRange').addEventListener('input', (e) => {
  currentHourIdx = parseInt(e.target.value);
  renderThermalHeatmap();
});

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentDay = e.target.getAttribute('data-day');
    renderThermalHeatmap();
  });
});

document.getElementById('zoomIn').onclick = () => map.zoomIn();
document.getElementById('zoomOut').onclick = () => map.zoomOut();

const playBtn = document.getElementById('playBtn');
playBtn.onclick = () => {
  if (isPlaying) {
    clearInterval(playInterval);
    isPlaying = false;
    playBtn.innerText = '▶';
  } else {
    isPlaying = true;
    playBtn.innerText = '⏸';
    playInterval = setInterval(() => {
      currentHourIdx = (currentHourIdx + 1) % hours.length;
      document.getElementById('hourRange').value = currentHourIdx;
      renderThermalHeatmap();
    }, 1100);
  }
};

window.addEventListener('load', () => {
  setTimeout(() => {
    map.invalidateSize();
    renderThermalHeatmap();
  }, 150);
});
</script>
